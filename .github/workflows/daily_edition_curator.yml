name: Tech Daily - Daily Edition Curator

on:
  schedule:
    # Runs daily at 23:30 UTC = 05:00 AM IST (India Standard Time)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Curator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python curator/curate_edition.py

      - name: Commit & Push Daily Edition
        run: |
          git config --local user.email "bot@techdaily.news"
          git config --local user.name "Tech Daily Curator Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(edition): auto-curate edition for $(TZ='Asia/Kolkata' date +'%Y-%m-%d')"
          git push origin HEAD:${{ github.ref }}
